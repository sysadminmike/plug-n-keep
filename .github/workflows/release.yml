# Builds the Windows and Linux downloads. A pushed v* tag also publishes a GitHub Release;
# a manual run only uploads the files as workflow artifacts.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install build packages (from BUILD.md)
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libxkbcommon-dev libwayland-dev \
            libgl1-mesa-dev libx11-dev
      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install   # reads rust-toolchain.toml
          rustup show
          rustc --version | grep -F ' 1.100.0 '
      - name: Build
        run: |
          # Keep runner paths out of the binary.
          export RUSTFLAGS="--remap-path-prefix=$GITHUB_WORKSPACE=. --remap-path-prefix=$HOME/.cargo=/cargo"
          cargo build --release --locked -p plug-n-keep
      - name: Check no runner paths are in the binary
        run: |
          if grep -a -q -F "$HOME/" target/release/plug-n-keep; then
            echo "::error::runner home path found in the binary"; exit 1
          fi
      - name: Check the glibc requirement (max 2.35)
        run: |
          highest=$(objdump -T target/release/plug-n-keep | grep -o 'GLIBC_[0-9.]*' | sort -V | tail -1)
          echo "Highest glibc symbol version needed: $highest"
          [ "$(printf '%s\n' "${highest#GLIBC_}" 2.35 | sort -V | tail -1)" = 2.35 ] \
            || { echo "::error::needs glibc newer than 2.35"; exit 1; }
      - name: Package
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then VERSION="${GITHUB_REF_NAME#v}"
          else VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)-dev"; fi
          dir="plug-n-keep-$VERSION"
          mkdir -p "dist/$dir"
          cp target/release/plug-n-keep README.md LICENSE THIRD-PARTY-NOTICES.md "dist/$dir/"
          chmod 755 "dist/$dir/plug-n-keep"
          tar -C dist --owner=0 --group=0 -czf "dist/$dir-linux-x86_64.tar.gz" "$dir"
          tar -tzvf "dist/$dir-linux-x86_64.tar.gz"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-x86_64
          path: dist/*.tar.gz
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install   # reads rust-toolchain.toml
          rustup show
          if ((rustc --version) -notmatch ' 1\.100\.0 ') { throw 'wrong rustc version' }
      # MSVC target with a static C runtime: no VC++ redistributable needed. build.rs finds rc.exe
      # in the Windows SDK by itself; the verification step below fails the job if the resources
      # are missing anyway.
      - name: Build
        run: |
          $cargoHome = if ($env:CARGO_HOME) { $env:CARGO_HOME } else { "$env:USERPROFILE\.cargo" }
          # Keep runner paths out of the exe.
          $env:RUSTFLAGS = "-C target-feature=+crt-static --remap-path-prefix=$env:GITHUB_WORKSPACE=. --remap-path-prefix=$cargoHome=/cargo"
          # An explicit --target keeps RUSTFLAGS (and the static CRT) off build scripts and macros.
          cargo build --release --locked -p plug-n-keep --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Verify resources and runtime dependencies
        run: |
          $latin1 = [Text.Encoding]::GetEncoding(28591)
          $bytes = $latin1.GetString([IO.File]::ReadAllBytes('target/x86_64-pc-windows-msvc/release/plug-n-keep.exe'))
          $utf16 = { param($s) $latin1.GetString([Text.Encoding]::Unicode.GetBytes($s)) }
          $fail = @()
          if (-not $bytes.Contains('requestedExecutionLevel')) { $fail += 'manifest missing' }
          if (-not ($bytes.Contains((& $utf16 'ProductName')) -and $bytes.Contains((& $utf16 'Plug-n-Keep')))) { $fail += 'VERSIONINFO missing' }
          foreach ($bad in 'VCRUNTIME140', 'libgcc_s', 'libwinpthread', 'libstdc++') {
            if ($bytes.Contains($bad)) { $fail += "needs $bad" }
          }
          foreach ($path in $env:GITHUB_WORKSPACE, $env:USERPROFILE) {
            if ($bytes.Contains($path)) { $fail += "runner path $path found in the exe" }
          }
          if ($fail) { throw ($fail -join '; ') }
          Write-Host 'exe has manifest and version info, and needs no extra runtime DLLs'
      - name: Package
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then VERSION="${GITHUB_REF_NAME#v}"
          else VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)-dev"; fi
          mkdir -p dist/stage
          cp target/x86_64-pc-windows-msvc/release/plug-n-keep.exe README.md LICENSE THIRD-PARTY-NOTICES.md dist/stage/
          powershell -NoProfile -Command "Compress-Archive -Path dist/stage/* -DestinationPath 'dist/plug-n-keep-$VERSION-windows-x86_64.zip'"
          rm -r dist/stage
          ls -l dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-x86_64
          path: dist/*.zip
          if-no-files-found: error

  checksums:
    needs: [linux, windows]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: SHA256SUMS
        run: |
          cd dist
          sha256sum -- *.zip *.tar.gz | tee SHA256SUMS.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: dist/*
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: checksums
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: dist
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          cat > notes.md <<'NOTES'
          - `plug-n-keep-*-windows-x86_64.zip`: Windows build (Windows 10 or later). Unzip and run `plug-n-keep.exe`.
          - `plug-n-keep-*-linux-x86_64.tar.gz`: Linux build. Built on Ubuntu 22.04, so it needs glibc 2.35 or newer.
          - `SHA256SUMS.txt`: checksums of the two archives (`sha256sum -c SHA256SUMS.txt`).

          The optional phone and camera libraries are described in [BUILD.md](https://github.com/sysadminmike/plug-n-keep/blob/main/BUILD.md).
          NOTES
          flags=()
          case "$GITHUB_REF_NAME" in *-*) flags+=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "$GITHUB_REF_NAME" \
            --notes-file notes.md "${flags[@]}"
